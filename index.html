<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria Boa Massa - Links</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* Fundo escuro para destacar a logo bege */
            font-family: 'Space Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            width: 180px;
            margin-bottom: 40px;
        }

        .btn {
            display: block;
            background-color: #ab0000; /* Vermelho solicitado */
            color: white;
            text-decoration: none;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: transform 0.2s, background-color 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #ce0000;
            transform: scale(1.02);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.7rem;
            opacity: 0.5;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.ibb.co/4gdyTgrK/Logo-Boa-Massa-bege.png" alt="Pizzaria Boa Massa" class="logo">

        <a href="https://delivery.softwarebistro.com.br/pizzariaboamassa" class="btn">SISTEMA DE PEDIDOS</a>
        <a href="/cardapio" class="btn">VER CARDÁPIO</a>
        <a href="https://wa.me/556798875252" class="btn" target="_blank">WHATSAPP</a>

        <div class="footer">
            PIZZARIA BOA MASSA
        </div>
    </div>

</body>
</html>
