<body>
    <div class="loader">
        <h2>Pizzaria Boa Massa</h2>
        <p>Estamos te levando para o nosso sistema de pedidos...</p>
    </div>

    <script>
        // 1. Lemos o parâmetro na URL (ex: ?s=status)
        const urlParams = new URLSearchParams(window.location.search);
        const origem = urlParams.get('s');

        // 2. Definimos as variáveis base (acesso direto sem parâmetro)
        let utmSource = 'direto';
        let utmMedium = 'link';

        // 3. Mapeamos a origem baseada no parâmetro
        if (origem === 'status') {
            utmSource = 'whatsapp';
            utmMedium = 'status';
        } else if (origem === 'msg') {
            utmSource = 'whatsapp';
            utmMedium = 'mensagem_direta';
        } else if (origem === 'insta') {
            utmSource = 'instagram';
            utmMedium = 'bio_ou_stories';
        }

        // 4. Montamos o link final com as UTMs direcionando para o Software Bistro
        const linkFinal = `https://delivery.softwarebistro.com.br/pizzariaboamassa?utm_source=${utmSource}&utm_medium=${utmMedium}&utm_campaign=pedido_direto`;

        // 5. Redirecionamento após 1.2s para o Google Analytics conseguir registrar o acesso
        setTimeout(function() {
            window.location.href = linkFinal;
        }, 1200);
    </script>
</body>
